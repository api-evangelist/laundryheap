apis:
- name: Laundryheap GraphQL API
  description: >-
    Laundryheap's primary product API. A single GraphQL endpoint serving the
    consumer web and mobile apps, covering ordering, recurring orders, addresses,
    timeslots, services, hotels, subscriptions, bundles, credits, promotions,
    Stripe-backed payment methods and reviews. Introspection is disabled and no
    schema is published, so the 69 fields recorded in this profile were read out
    of Laundryheap's own production client bundle and confirmed field-by-field
    against the live endpoint's did-you-mean errors.
  humanURL: https://www.laundryheap.com/
  baseURL: https://www.laundryheap.com/graphql
  tags:
  - GraphQL
  - Ordering
  - Laundry
  properties:
  - type: GraphQL
    url: graphql/laundryheap-graphql.yml
  - type: DataModel
    url: data-model/laundryheap-data-model.yml
  - type: ErrorCatalog
    url: errors/laundryheap-problem-types.yml
- name: Laundryheap OAuth 2.0 / OpenID Connect Authorization Server
  description: >-
    A live, spec-clean OAuth 2.0 and OpenID Connect provider on Laundryheap's root
    host, discovered only by probing /.well-known/. It advertises the
    authorization_code (with PKCE) and client_credentials grants, RS256 ID tokens,
    RFC 7662 introspection, RFC 7009 revocation and open RFC 7591 dynamic client
    registration, and it declares a single business scope, `orders.create` — the
    only public evidence anywhere that Laundryheap intends third parties to place
    orders programmatically. No documentation for it exists.
  humanURL: https://www.laundryheap.com/.well-known/openid-configuration
  baseURL: https://www.laundryheap.com/oauth
  tags:
