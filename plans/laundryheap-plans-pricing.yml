commercial_terms:
  delivery: Free delivery, stated across the site.
  turnaround: 24 hours standard; 72 hours for duvets, bulky items and repairs.
  in_product_commerce:
    note: >-
      The GraphQL surface carries credits, bundles, subscriptions and promo
      codes (buyCredits, purchaseBundle, bundleGroups, createSubscription,
      redeemSubscriptionCode, applyPromoCode), so a subscription/credit product
      exists — but no page publishes its tiers or prices, so nothing is recorded
      for it here.
  payment_processor: Stripe (stripePublishableKey query, createSetupIntent, attachPaymentMethod)

