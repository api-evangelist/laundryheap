source: >-
  graphql/laundryheap-graphql.yml — derived from the 69 GraphQL fields and their
  argument types extracted from Laundryheap's published production client bundle.
description: >-
  The entity graph implied by Laundryheap's GraphQL surface. Derived, not read:
  introspection is disabled and no schema is published, so entities and edges are
  inferred from argument names, argument types and the fields that co-occur in
  the company's own client operations. Types named in ALL CAPS of the GraphQL
  argument syntax (ServiceCountryEnum, OrderStateEnumType, ...) are real — they
  appear verbatim in the published operations. Return-side fields are NOT
  modelled, because nothing published defines them.
confidence: medium
confidence_note: >-
  High confidence in the entities and in every relationship carried by an
  observed argument (e.g. createOrder taking an addressId proves Order belongs_to
  Address). Lower confidence in cardinality, which is inferred from plural vs
  singular field naming.

entities:
  - name: User
    fields_observed: [firstName, lastName, phone, email, serviceCountry, companyUser]
    operations: [me, updateUser, createGuestUser, verifyMagicLink, authorize, checkEmailTypos, isEmailTaken, isPhoneTaken, isPhoneTakenWithEmailV2]
    note: A guest user can be created without a password (createGuestUser), then upgraded.
  - name: Address
    fields_observed: [city, country, countryCode, latitude, longitude, isDefault, udprn, addressType]
    operations: [addresses, createAddress, updateAddress, validateAddressWithMappedCity]
    note: >-
      Geocoded (lat/lng required on create and update) and validated against a
      city mapping. `udprn` is the Royal Mail Unique Delivery Point Reference
      Number — a UK-specific address identifier.
  - name: Order
    identifier: uuid (String)
    operations: [order, ordersV2, createOrder, modifyOrder, cancelOrder, updateOrderServices, getPaymentPolicy, sendInvoiceMail]
    state_enum: OrderStateEnumType
    sort_enum: OrderSortEnum
    fields_observed: [pickupAfterDateTime, pickupBeforeDateTime, dropOffAfterDateTime, dropOffBeforeDateTime, dropoffMethod]
    note: >-
      Identified by an opaque uuid string, not a numeric id. Carries a four-part
      time window — a pickup window and a dropoff window, each with an after and
      a before bound.
  - name: RepeatOrder
    identifier: uuid (String)
    operations: [repeatOrder, repeatOrders, repeatOrderUpdate, repeatOrderUpdateSchedule, repeatOrderDelete, repeatOrderTimeslots]
    note: A recurring-order template, scheduled separately from the Orders it generates.
  - name: Service
    identifier: short_code
    operations: [services, updateOrderServices, getExpressOrderInfo]
    input_type: OrderServiceInput
    known_values: [mixed_wash, separate_wash, wash_and_iron, dry_cleaning, ironing, duvets_bulky_items, repairs]
    note: >-
      Confirmed independently against the live REST endpoint
      /api/v1/services?address=London, saved at
      examples/laundryheap-services-response.json.
  - name: Timeslot
    operations: [timeslotsV2, repeatOrderTimeslots]
    type_enum: AvailabilityTypeEnumType
    fields_observed: [pickupAfterTime, pickupBeforeTime, dropoffAfterTime, dropoffBeforeTime, serviceIds]
  - name: ServiceCountry
    identifier: ServiceCountryEnum
    operations: [serviceCountries, countries, city, globalNotice]
    note: >-
      The single most pervasive argument in the whole API — ServiceCountryEnum
      appears on 14 separate fields. Country is the primary partition key of the
      entire data model.
  - name: City
    operations: [city, globalNotice, validateAddressWithMappedCity]
  - name: Hotel
    operations: [hotels]
    filter_type: HotelFilterInputType
    note: >-
      The B2B surface. Hotels are first-class entities queried by service country
      with a structured filter, matching the hotel-affiliate programme the
      marketing site advertises.
  - name: Subscription
    identifier: SubscriptionShortCodeEnum
    operations: [subscriptions, createSubscription, updateSubscription, redeemSubscriptionCode]
    note: No cancel mutation is exposed on this surface.
  - name: Bundle
    operations: [bundles, bundleGroups, purchasedBundles, purchaseBundle]
    fields_observed: [bundleId]
    note: Prepaid packs, grouped into bundleGroups.
  - name: Credit
    operations: [creditsInfo, creditTransactions, buyCredits, claimCredits, userBenefits]
    input_types: [BuyInput, ClaimInput]
    note: A wallet with a transaction ledger (creditTransactions is paginated).
  - name: Promotion
    operations: [promotionCards, validPromotion, applyPromoCode, removePromoCode]
    fields_observed: [promoCode]
    note: Applied to and removed from a specific Order by uuid.
  - name: PaymentMethod
    operations: [creditCards, setDefaultCreditCard, createStripeCustomer, createSetupIntent, attachPaymentMethod, getPaymentInfo, stripePublishableKey]
    processor: Stripe
    note: >-
      Stripe SetupIntent flow. Laundryheap stores a Stripe customer and payment
      method reference, not card data.
  - name: Review
    operations: [postServiceReview, postDriverPickupReview]
    enums: [ServiceReviewStepEnum, ServiceReviewOptionEnum, OrderDriverPickupReviewStepEnum, OrderDriverPickupReviewOptionEnum]
    note: >-
      Two separate review entities — one for the cleaning service, one for the
      driver pickup — each a multi-step survey with enumerated options.
  - name: Device
    operations: [createUserDeviceInfo]
    enums: [DeviceOsEnum, DeviceIdTypeEnum]
    note: Device registration, presumably for push notifications.
  - name: GlobalSetting
    operations: [globalSettings, globalNotice, appInit, getCloudFrontInfo, mobileAppUrl]
    note: >-
      Confirmed as a real GraphQL type by the server itself — querying
      globalSettings without a selection set returns "field 'globalSettings'
      returns GlobalSetting".

