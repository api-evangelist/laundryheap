description: >-
  Laundryheap publishes no versioning policy, no deprecation policy, no SLA and
  no status page. What versioning it does practise is visible only in the shape
  of its own GraphQL field names.

versioning:
  scheme: additive field suffixes (GraphQL); uri-path (REST)
  current: unversioned /graphql; /api/v1 for the REST surface
  docs: null
  policy_published: false
  evidence: >-
    ordersV2, timeslotsV2 and isPhoneTakenWithEmailV2 coexist with unsuffixed
    predecessors in the published client. New behaviour is shipped as a new
    field rather than a breaking change to the old one — an additive strategy
    that is good practice, but it is a practice, not a published policy.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  observed: >-
