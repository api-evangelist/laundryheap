  - type: Authentication
    url: authentication/laundryheap-authentication.yml
  - type: OAuthScopes
    url: scopes/laundryheap-scopes.yml
- name: Laundryheap Service Catalogue API
  description: >-
    A small unauthenticated JSON endpoint under /api/v1 that returns the laundry
    and dry-cleaning services available at a given address, with each service's
    short code, description, minimum service duration and turnaround time. It is
    the only Laundryheap endpoint that answers usefully without credentials.
  humanURL: https://www.laundryheap.com/en-gb/pricing
  baseURL: https://www.laundryheap.com/api/v1
