aid: laundryheap
name: Laundryheap
description: >-
  Laundryheap is a London-founded on-demand laundry and dry-cleaning company that
  collects, cleans and returns clothing within 24 hours, operating across the
  United Kingdom, United States, Ireland, the Netherlands, Sweden, Denmark, the
  UAE, Qatar, Kuwait, Bahrain and Singapore. It serves consumers directly through
  iOS, Android and web apps, and businesses through hotel-affiliate, commercial
  laundry and dry-cleaning partner programmes. Laundryheap operates no developer
  portal and publishes no API documentation, but it does run a real, live,
  standards-clean OAuth 2.0 and OpenID Connect authorization server on its own
  root host — complete with PKCE, token introspection, token revocation and open
  dynamic client registration — advertising an `orders.create` scope, alongside a
  production GraphQL API of 69 fields and a small unauthenticated JSON endpoint
  that returns its service catalogue. The API surface is real and substantial;
  what is missing is any documentation of it.
