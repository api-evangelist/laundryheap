generated: '2026-08-23'
method: searched
source: >-
  https://www.laundryheap.com/en-gb/pricing and its five per-service pricelists,
  fetched 2026-08-23.
description: >-
  Laundryheap sells a service, not API access. There is no API plan, no
  developer tier and no published cost for calling the API — the OAuth server
  and its `orders.create` scope have no commercial terms attached to them
  anywhere on the public surface. What Laundryheap does publish, and publishes
  well, is a full itemised consumer pricelist per country and per service. Both
  facts are recorded below: the API plan count is an honest zero, and the
  service pricing is captured because it is the real, published, machine-usable
  commercial surface an agent would be pricing against.

plan_count: 0
plans: []
plans_note: >-
  Zero API access plans. Probed /en-gb/subscriptions, /en-gb/membership and
  /en-gb/plans — all three soft-404 to the homepage. No developer pricing page,
  no free tier, no rate-card, no "contact sales" API form. Partner enquiries go
  to collaborate@laundryheap.com with no published terms.

api_commercial_model:
  published: false
  access_request: collaborate@laundryheap.com (general business enquiries; not an API programme)
  free_tier: null
  note: >-
    Dynamic client registration is open at /oauth/registration, so a client can
    self-register without any commercial agreement being visible. Whether that
    grants usable access is not published.

service_pricing:
  published: true
  currency_varies_by_country: true
  structure: >-
    Per-country pricelists, one per service. Wash & Fold is priced by weight;
    Wash & Iron, Dry Cleaning, Ironing and Duvets & Bulky Items are priced per
    item. The booking flow itemises the actual order and the site states
    "Prices depend on your city and the items you send. You'll see exact pricing
    upfront before confirming your order."
  machine_readable_endpoint:
    url: https://www.laundryheap.com/api/v1/services?address=<address>
    status: 200
    note: >-
      Returns the service catalogue (title, short_code, description,
      minimum_service_minutes, turnaround_time) for a resolvable address,
      unauthenticated. Saved verbatim at
      examples/laundryheap-services-response.json. It returns the catalogue, not
      the prices.
