candidate_tools:
  - name: list_services
    description: List the laundry and dry-cleaning services available at an address.
    source_field: 'query services(serviceCountry, latitude, longitude, onlyExpress)'
    also_available_as: GET /api/v1/services?address= (unauthenticated, live)
    consequence: read
  - name: list_timeslots
    description: List available pickup and dropoff time windows for a set of services.
    source_field: 'query timeslotsV2(type, pickupAfterTime, pickupBeforeTime, dropoffAfterTime, dropoffBeforeTime, serviceIds)'
    consequence: read
  - name: validate_address
    description: Validate a latitude/longitude against Laundryheap's serviceable city map.
    source_field: 'mutation validateAddressWithMappedCity(latitude!, longitude!, serviceCountry)'
    consequence: read
  - name: list_addresses
    description: List the authenticated account's saved addresses.
    source_field: query addresses
    consequence: read
  - name: create_address
    description: Save a geocoded delivery address on the account.
    source_field: 'mutation createAddress(countryCode!, latitude!, longitude!, city, country, isDefault)'
    consequence: write
  - name: get_price_estimate
    description: Retrieve the payment information and estimate for a prospective order.
    source_field: 'query getPaymentInfo(serviceCountry!, addressID, lat, lng, addressType, udprn)'
    consequence: read
  - name: create_order
    description: Book a laundry collection and delivery.
    source_field: 'mutation createOrder(pickupAfterDateTime!, pickupBeforeDateTime!, dropOffAfterDateTime!, dropOffBeforeDateTime!, ...)'
    consequence: write
    reversible: true
    reversal: cancel_order within 2 hours of collection at no cost
    scope: orders.create
  - name: modify_order
    description: Change the pickup or dropoff window on an existing order.
    source_field: 'mutation modifyOrder(uuid, pickupAfterDateTime, pickupBeforeDateTime, dropOffAfterDateTime, dropOffBeforeDateTime)'
    consequence: write
  - name: cancel_order
    description: Cancel an order, with structured reasons.
    source_field: 'mutation cancelOrder(uuid, reasons)'
    consequence: write
    reversible: false
    window: free up to 2 hours before collection; a fee applies inside that window
  - name: list_orders
    description: List the account's orders, filtered by state and paginated.
    source_field: 'query ordersV2(page, perPage, sortBy, sortDirection, state!)'
    consequence: read
  - name: get_order
    description: Retrieve a single order by uuid.
    source_field: 'query order(uuid!)'
    consequence: read
  - name: list_hotels
    description: List Laundryheap partner hotels in a service country.
    source_field: 'query hotels(serviceCountry!, filter)'
    consequence: read
  - name: apply_promo_code
    description: Apply a promotional code to an order.
    source_field: 'mutation applyPromoCode(uuid!, promoCode!)'
    consequence: write
    reversible: true
    reversal: removePromoCode

